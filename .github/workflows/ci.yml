name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  storefront:
    name: Storefront (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and run smoke tests
        run: npm test

      - name: Run unit tests
        run: npm run test:unit

  inventory-platform:
    name: Inventory platform (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: inventory-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Run tests
        run: pnpm turbo run test test:unit
