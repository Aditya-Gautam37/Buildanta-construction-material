services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buildanta_inventory
      POSTGRES_USER: buildanta
      POSTGRES_PASSWORD: buildanta
    ports:
      - "5433:5432"
    volumes:
      - buildanta_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildanta -d buildanta_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buildanta_inventory_data:
