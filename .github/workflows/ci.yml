name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  storefront:
    name: Storefront (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and run smoke tests
        run: npm test

      - name: Run unit tests
        run: npm run test:unit

  inventory-platform:
    name: Inventory platform (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: inventory-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Generate Prisma client
        run: pnpm --filter @workspace/db db:generate

      # Real compilation, not just typecheck, for the app whose Vercel deploy
      # skips its own build step (see apps/nest-api/vercel.json — it only
      # regenerates the Prisma client, since Vercel's Node runtime transpiles
      # api/index.ts without type-checking it). inventory-management's own
      # `next build` already type-checks as part of Vercel's normal Next.js
      # build, so it isn't duplicated here.
      - name: Build nest-api
        run: pnpm --filter nest-api build

      - name: Run tests
        run: pnpm turbo run test test:unit test:e2e
